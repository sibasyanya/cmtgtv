name: Build Android TV APK & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG (Version: $VER)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Precompiled TDLib JNI Native Libraries
        run: |
          echo "Setting up verified TDLib JNI native C++ libraries for Android..."
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86
          mkdir -p android/app/src/main/jniLibs/x86_64

          # Загружаем проверенный релиз FaiBah-Dev TDLibAndroidPrebuilt (v1.8.67-d1085f9-Java)
          # содержащий точные нативные библиотеки libtdjni.so с JNI точками входа org.drinkless.tdlib.Client
          BASE_URL="https://github.com/FaiBah-Dev/TDLibAndroidPrebuilt/releases/download/v1.8.67-d1085f9-Java"
          
          echo "Downloading armeabi-v7a..."
          curl -sL --retry 3 "${BASE_URL}/tdlib-Java-armeabi-v7a.zip" -o /tmp/td_armv7.zip
          unzip -q -o /tmp/td_armv7.zip -d /tmp/td_armv7
          cp /tmp/td_armv7/libs/armeabi-v7a/libtdjni.so android/app/src/main/jniLibs/armeabi-v7a/

          echo "Downloading arm64-v8a..."
          curl -sL --retry 3 "${BASE_URL}/tdlib-Java-arm64-v8a.zip" -o /tmp/td_arm64.zip
          unzip -q -o /tmp/td_arm64.zip -d /tmp/td_arm64
          cp /tmp/td_arm64/libs/arm64-v8a/libtdjni.so android/app/src/main/jniLibs/arm64-v8a/

          echo "Downloading x86..."
          curl -sL --retry 3 "${BASE_URL}/tdlib-Java-x86.zip" -o /tmp/td_x86.zip
          unzip -q -o /tmp/td_x86.zip -d /tmp/td_x86
          cp /tmp/td_x86/libs/x86/libtdjni.so android/app/src/main/jniLibs/x86/

          echo "Downloading x86_64..."
          curl -sL --retry 3 "${BASE_URL}/tdlib-Java-x86_64.zip" -o /tmp/td_x86_64.zip
          unzip -q -o /tmp/td_x86_64.zip -d /tmp/td_x86_64
          cp /tmp/td_x86_64/libs/x86_64/libtdjni.so android/app/src/main/jniLibs/x86_64/

          echo "Verification of installed libtdjni.so libraries:"
          ls -lh android/app/src/main/jniLibs/*/*.so

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --info --no-daemon

      - name: Upload Gradle Reports and Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
            ~/.gradle/daemon/
          if-no-files-found: ignore

      - name: Locate and Rename APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            # If release build without signing key falls back to unsigned or debug
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"
          TAG="${{ steps.version.outputs.tag }}"
          OUTPUT_NAME="tgmedia-tv-${TAG}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Telegram Media TV ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG.md
          files: ${{ steps.apk.outputs.apk_path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Notification to Telegram Channel
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          MESSAGE="🚀 *Вышло обновление Telegram Media TV ${TAG}!*

          📺 *Что нового:*
          Смотрите подробности в приложении или на GitHub.

          ⬇️ *Скачать APK:*
          https://github.com/${{ github.repository }}/releases/download/${TAG}/tgmedia-tv-${TAG}.apk"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"

