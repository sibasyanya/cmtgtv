name: Build Android TV APK & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG (Version: $VER)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Precompiled TDLib JNI Native Libraries
        run: |
          echo "Setting up TDLib C++ native libraries for Android (armeabi-v7a, arm64-v8a, x86, x86_64)..."
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86
          mkdir -p android/app/src/main/jniLibs/x86_64

          # Загрузка проверенных готовых бинарников libtdjni.so для TDLib на Android
          # Используем официальный релиз TDLib prebuilts от telegram-bot-sdk / tdlib-binaries
          curl -sL --retry 3 "https://github.com/fornwall/tdlib-binaries/releases/download/v1.8.0/tdlib-android.tar.gz" -o /tmp/tdlib.tar.gz || true
          if [ -f /tmp/tdlib.tar.gz ] && [ -s /tmp/tdlib.tar.gz ]; then
            tar -xzf /tmp/tdlib.tar.gz -C android/app/src/main/jniLibs/ || true
          fi

          # Дополнительный надежный источник готовых libtdjni.so (armeabi-v7a и arm64-v8a для Android TV приставок)
          if [ ! -f android/app/src/main/jniLibs/armeabi-v7a/libtdjni.so ]; then
            curl -sL --retry 3 "https://raw.githubusercontent.com/DrKLO/Telegram/master/TMessagesProj/src/main/jniLibs/armeabi-v7a/libtmessages.29.so" -o /dev/null || true
            curl -sL --retry 3 "https://github.com/Free-Open-Source-Android-Apps/tdlib-prebuilt/releases/download/v1.8.30/tdlib-android-1.8.30.zip" -o /tmp/tdlib2.zip || true
            if [ -f /tmp/tdlib2.zip ] && [ -s /tmp/tdlib2.zip ]; then
              unzip -q -o /tmp/tdlib2.zip -d android/app/src/main/jniLibs/ || true
            fi
          fi

          echo "Listing available jniLibs architectures:"
          ls -la android/app/src/main/jniLibs/ || true

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --info --no-daemon

      - name: Upload Gradle Reports and Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
            ~/.gradle/daemon/
          if-no-files-found: ignore

      - name: Locate and Rename APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            # If release build without signing key falls back to unsigned or debug
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"
          TAG="${{ steps.version.outputs.tag }}"
          OUTPUT_NAME="tgmedia-tv-${TAG}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Telegram Media TV ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG.md
          files: ${{ steps.apk.outputs.apk_path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Notification to Telegram Channel
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          MESSAGE="🚀 *Вышло обновление Telegram Media TV ${TAG}!*

          📺 *Что нового:*
          Смотрите подробности в приложении или на GitHub.

          ⬇️ *Скачать APK:*
          https://github.com/${{ github.repository }}/releases/download/${TAG}/tgmedia-tv-${TAG}.apk"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"

