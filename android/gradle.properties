# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseParallelGC

# AndroidX enables modern Jetpack libraries support
android.useAndroidX=true

# Namespaced R classes for faster incremental compilation
android.nonTransitiveRClass=true

# Kotlin style
kotlin.code.style=official
